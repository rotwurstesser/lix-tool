[package]
name = "lix-writer"
version = "0.1.0"
description = "LIX Writer"
edition = "2021"

[lib]
name = "lix_writer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.0", features = [] }

[dependencies]
tauri = { version = "=2.12.0", features = [] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
# LanguageTool download (grammar.rs).
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "blocking"] }
sha2 = { version = "=0.11.0", default-features = false }
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "=0.3.2", features = ["NSString", "NSRange"] }
objc2-app-kit = { version = "=0.3.2", features = ["NSSpellChecker"] }

# Runs on the main thread: NSSpellChecker needs it.
[[test]]
name = "spell_parity"
harness = false
